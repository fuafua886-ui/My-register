<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>ምዝገባ እና መግቢያ</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            max-width: 550px;
            width: 100%;
            background: white;
            border-radius: 36px;
            padding: 30px 25px;
            box-shadow: 0 25px 45px rgba(0,0,0,0.2);
            transition: 0.3s;
        }
        .mode-buttons { display: flex; gap: 15px; margin-bottom: 20px; }
        .mode-btn {
            flex: 1; background: #e0e0e0; color: #333; border: none;
            padding: 12px; border-radius: 60px; font-weight: bold; cursor: pointer;
        }
        .mode-btn.active { background: #1a3e60; color: white; }
        .step { display: none; animation: fadeIn 0.4s ease; }
        .step.active { display: block; }
        @keyframes fadeIn { from { opacity:0; transform:translateY(15px);} to { opacity:1; transform:translateY(0);} }
        input, button {
            width: 100%; padding: 14px 18px; margin: 10px 0;
            border: 1px solid #ddd; border-radius: 60px; font-size: 16px;
        }
        button {
            background: #1a3e60; color: white; border: none; font-weight: bold;
            cursor: pointer; transition: 0.2s;
        }
        button:hover { background: #0e2a42; transform: scale(0.98); }
        .photo-actions { display: flex; gap: 12px; margin: 10px 0; }
        .photo-actions button { flex: 1; background: #2c3e50; }
        .photo-preview {
            text-align: center; margin: 15px 0; min-height: 160px;
            background: #f5f5f5; border-radius: 20px;
            display: flex; align-items: center; justify-content: center;
        }
        .photo-preview img { max-width: 100%; max-height: 220px; border-radius: 28px; border: 2px solid #ccc; }
        .message {
            position: fixed; bottom: 20px; left: 20px; right: 20px; z-index: 100;
            text-align: center; font-weight: bold; padding: 10px; border-radius: 50px;
        }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .info-text { font-size: 13px; color: #6c757d; text-align: center; margin-top: 10px; }
        .switch-text { text-align: center; margin-top: 15px; font-size: 14px; }
        .switch-text span { color: #1a3e60; cursor: pointer; font-weight: bold; text-decoration: underline; }
        
        /* አዲስ የተጨመረ የዳሽቦርድ ዲዛይን */
        #userDashboard {
            display: none; width: 100%; max-width: 800px; margin: 0 auto;
            background: white; border-radius: 30px; padding: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2); max-height: 90vh; overflow-y: auto;
        }
        .dash-header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 2px solid #eee; padding-bottom: 15px; margin-bottom: 20px;
        }
        .dash-header h2 { color: #1a3e60; font-size: 20px; }
        .logout-btn { background: #c0392b; padding: 8px 15px; width: auto; margin: 0; font-size: 14px; border-radius: 20px; }
        .live-badge { background: #27ae60; color: white; padding: 4px 10px; border-radius: 20px; font-size: 12px; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }
        .user-list-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 15px; }
        .user-item {
            background: #f8f9fa; border: 1px solid #e9ecef; border-radius: 15px;
            padding: 15px; display: flex; align-items: center; gap: 15px;
        }
        .user-item img { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; border: 2px solid #1a3e60; }
        .user-info h4 { font-size: 16px; color: #2c3e50; margin-bottom: 4px; }
        .user-info p { font-size: 13px; color: #6c757d; }
        .blocked-badge { background: #e67e22; color: white; font-size: 10px; padding: 2px 6px; border-radius: 10px; margin-left: 5px; }
    </style>
</head>
<body>

<!-- ዋናው የምዝገባ/መግቢያ ገጽ -->
<div id="mainCard" class="card">
    <div class="mode-buttons">
        <button id="registerModeBtn" class="mode-btn active">📝 register</button>
        <button id="loginModeBtn" class="mode-btn">🔐 log in</button>
    </div>

    <div id="registerSection">
        <div id="step1" class="step active">
            <h1>📋 መረጃ በትክክል ይሙሉ</h1>  
            <input type="tel" id="regPhone" placeholder="📞 09XXXXXXXX" autocomplete="off">
            <input type="text" id="regFullname" placeholder="👤 ሙሉ ስም">
            <input type="text" id="regFathername" placeholder="👨 የአባት ስም">
            <input type="password" id="regPassword" placeholder="🔒 ፓስወርድ (ቁጥር ብቻ)">
            <button id="submitRegisterStep1">✅ ቀጥል</button>
            <div class="info-text"></div>
        </div>

        <div id="step2" class="step">
            <h1>📸 ፎቶ ይምረጡ</h1> 
            <div class="photo-preview" id="photoPreviewArea">📸 ካሜራ ወይም ጋላሪ ይጫኑ</div>
            <div class="photo-actions">
                <button id="cameraFrontBtn">📸 ካሜራ</button>
                <button id="galleryBtn">🖼️ ከጋላሪ</button>
            </div>
            <button id="acceptPhotoBtn" style="background:#27ae60;">✅ ፎቶ ተቀበል</button>
            <div class="info-text">ፎቶ ከመረጡ በኋላ "ፎቶ ተቀበል" ይጫኑ።</div>
        </div>
    </div>

    <div id="loginSection" style="display: none;">
        <h2>🔐 ወደ መግቢያ ገጽ እንኳን ደህና መጡ</h2>
        <input type="tel" id="loginPhone" placeholder="📞 09XXXXXXXX">
        <input type="password" id="loginPassword" placeholder="🔒 ፓስወርድ">
        <button id="doLoginBtn">🚀 ግባ</button>
        <div class="switch-text">አካውንት የለዎትም? <span id="switchToRegister">አሁን ይመዝገቡ</span></div>
    </div>
</div>

<!-- አዲስ የተጨመረ የተጠቃሚ ዳሽቦርድ (ተጠቃሚው ሲገባ የሚታይ) -->
<div id="userDashboard">
    <div class="dash-header">
        <h2>👥 የተጠቃሚዎች ዝርዝር <span class="live-badge">● Live</span></h2>
        <button class="logout-btn" onclick="logoutUser()">ውጣ</button>
    </div>
    <div id="userListContainer" class="user-list-grid">
        <!-- መረጃው በ onSnapshot እዚህ ጋር ይጫናል -->
        <p style="text-align:center; width:100%; color:#666;">መረጃ በመጫን ላይ...</p>
    </div>
</div>

<div id="globalMessage" class="message"></div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAgIAS0hWRkZlg38kKH7O6V0JXg__j2zE8",
        authDomain: "my-user-system-13ec2.firebaseapp.com",
        projectId: "my-user-system-13ec2",
        storageBucket: "my-user-system-13ec2.firebasestorage.app",
        messagingSenderId: "388651452442",
        appId: "1:388651452442:web:9eb39716c680a8e66ca9a3",
        measurementId: "G-N05W17L3HN"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    
    // የመሸጎጫ ችግርን ለማስወገድ
    db.settings({ experimentalForceLongPolling: true });

    let unsubscribeSnapshot = null; // የቀጥታ ማዳመጫውን ለማቆም የሚያገለግል

    function showMessage(msg, isSuccess = true) {
        const msgDiv = document.getElementById('globalMessage');
        msgDiv.textContent = msg;
        msgDiv.className = 'message ' + (isSuccess ? 'success' : 'error');
        setTimeout(() => msgDiv.className = 'message', 4000);
    }
    
    function validatePhone(p) { return /^09\d{8}$/.test(p); }
    function validatePassword(p) { return /^\d+$/.test(p); }
    function validateName(n) { return n.trim().length >= 2; }

    async function saveWithTimeout(promise, timeoutMs = 30000) {
        let timeoutId;
        const timeoutPromise = new Promise((_, reject) => {
            timeoutId = setTimeout(() => reject(new Error("timeout")), timeoutMs);
        });
        try {
            const result = await Promise.race([promise, timeoutPromise]);
            clearTimeout(timeoutId);
            return result;
        } catch (error) {
            clearTimeout(timeoutId);
            throw error;
        }
    }

    async function isAppBlocked() {
        try {
            const blockDoc = await db.collection("system").doc("globalBlock").get();
            return blockDoc.exists && blockDoc.data().blocked === true;
        } catch { return false; }
    }

    async function isPhoneRegistered(phone) {
        const snapshot = await db.collection("users").where("phone", "==", phone).limit(1).get();
        return !snapshot.empty;
    }

    async function isFullNameRegistered(fullName) {
        const snapshot = await db.collection("users").where("fullName", "==", fullName).limit(1).get();
        return !snapshot.empty;
    }

    let pendingDocId = null;
    let globalTimeoutId = null;

    async function saveInitialUserData(userObj) {
        try {
            const promise = db.collection("users").add({
                phone: userObj.phone,
                fullName: userObj.fullName,
                fatherName: userObj.fatherName,
                password: userObj.password,
                photoData: null,
                photoStatus: 'pending',
                step: 'step1_complete',
                blocked: false,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });
            const docRef = await saveWithTimeout(promise, 25000);
            return docRef.id;
        } catch (error) {
            console.error("Firestore initial save error:", error);
            if (error.message === "timeout") {
                showMessage("ጊዜ አልፏል። እባክዎ የኢንተርኔት ግንኙነትዎን ያረጋግጡ እና ዳግም ይሞክሩ", false);
            }
            return null;
        }
    }

    async function updateUserWithPhoto(docId, photoData) {
        try {
            const promise = db.collection("users").doc(docId).update({
                photoData: photoData,
                photoStatus: 'accepted',
                step: 'complete_with_photo'
            });
            await saveWithTimeout(promise, 25000);
            return true;
        } catch (error) {
            console.error("Firestore update error:", error);
            return false;
        }
    }

    async function findUserForLogin(phone, password) {
        try {
            const snapshot = await db.collection("users")
                .where("phone", "==", phone)
                .where("password", "==", password)
                .limit(1)
                .get();
            if (snapshot.empty) return { exists: false };
            const userData = snapshot.docs[0].data();
            return { 
                exists: true, 
                blocked: userData.blocked === true,
                photoStatus: userData.photoStatus,
                fullName: userData.fullName
            };
        } catch (error) {
            return { exists: false, error: true };
        }
    }

    // ==========================================
    // 🔥 አዲሱ የቀጥታ ማዳመጫ (Real-time Listener) ክፍል
    // ==========================================
    function startLiveUserListener() {
        const container = document.getElementById('userListContainer');
        container.innerHTML = '<p style="text-align:center; width:100%;">በመጫን ላይ...</p>';

        // ከሰርቨሩ ላይ በቀጥታ መረጃውን ያዳምጣል
        unsubscribeSnapshot = db.collection("users").orderBy("timestamp", "desc")
            .onSnapshot((snapshot) => {
                let html = '';
                let count = 0;
                
                snapshot.forEach(doc => {
                    const user = doc.data();
                    // የተገዱ ተጠቃሚዎችን ማሳየት ካልፈለግን እዚህ ጋር ማጣራት እንችላለን (ለምሳሌ የተገዱትን ላሳይ)
                    if (user.blocked) return; 

                    count++;
                    const photo = user.photoData ? user.photoData : 'https://via.placeholder.com/50?text=No+Image';
                    const blockedLabel = user.blocked ? '<span class="blocked-badge">ተግዷል</span>' : '';

                    html += `
                        <div class="user-item">
                            <img src="${photo}" alt="photo">
                            <div class="user-info">
                                <h4>${user.fullName || 'ያልተሟላ'} ${blockedLabel}</h4>
                                <p>📞 ${user.phone || '❌'}</p>
                            </div>
                        </div>
                    `;
                });

                if (count === 0) {
                    container.innerHTML = '<p style="text-align:center; width:100%;">እስካሁን ምንም ተጠቃሚ የለም።</p>';
                } else {
                    container.innerHTML = html;
                }
            }, (error) => {
                console.error("Snapshot error:", error);
                container.innerHTML = '<p style="text-align:center; width:100%; color:red;">መረጃ መጫን አልተቻለም። ኢንተርኔትዎን ያረጋግጡ።</p>';
            });
    }

    function stopLiveUserListener() {
        if (unsubscribeSnapshot) {
            unsubscribeSnapshot();
            unsubscribeSnapshot = null;
        }
    }

    // ተጠቃሚውን ወደ ዳሽቦርድ መላክ
    function showDashboard() {
        document.getElementById('mainCard').style.display = 'none';
        document.getElementById('userDashboard').style.display = 'block';
        startLiveUserListener(); // ዳሽቦርዱ ሲከፈት ቀጥታ ማዳመጥ ይጀምራል
    }

    // ከዳሽቦርድ መውጣት (Logout)
    window.logoutUser = function() {
        stopLiveUserListener(); // ማዳመጥን አቁም
        document.getElementById('userDashboard').style.display = 'none';
        document.getElementById('mainCard').style.display = 'block';
        document.getElementById('loginSection').style.display = 'block';
        document.getElementById('registerSection').style.display = 'none';
        setMode('login');
    };

    // ሁነታ መቀየሪያ
    const registerModeBtn = document.getElementById('registerModeBtn');
    const loginModeBtn = document.getElementById('loginModeBtn');
    const registerSection = document.getElementById('registerSection');
    const loginSection = document.getElementById('loginSection');
    const switchToRegister = document.getElementById('switchToRegister');

    function setMode(mode) {
        if (mode === 'register') {
            registerSection.style.display = 'block';
            loginSection.style.display = 'none';
            registerModeBtn.classList.add('active');
            loginModeBtn.classList.remove('active');
        } else {
            registerSection.style.display = 'none';
            loginSection.style.display = 'block';
            registerModeBtn.classList.remove('active');
            loginModeBtn.classList.add('active');
        }
    }
    registerModeBtn.onclick = () => setMode('register');
    loginModeBtn.onclick = () => setMode('login');
    if(switchToRegister) switchToRegister.onclick = () => setMode('register');

    let tempRegData = { phone:'', fullName:'', fatherName:'', password:'', photoData:null };
    let currentPhotoData = null;

    // ደረጃ 1 ማስገቢያ
    document.getElementById('submitRegisterStep1').onclick = async () => {
        const phone = document.getElementById('regPhone').value.trim();
        const fullName = document.getElementById('regFullname').value.trim();
        const fatherName = document.getElementById('regFathername').value.trim();
        const password = document.getElementById('regPassword').value;

        if(!validatePhone(phone)) return showMessage("ስልክ 09XXXXXXXX መሆን አለበት", false);
        if(!validateName(fullName)) return showMessage("ስም ያስገቡ", false);
        if(!validateName(fatherName)) return showMessage("የአባት ስም ያስገቡ", false);
        if(!validatePassword(password)) return showMessage("ፓስወርድ ቁጥር ብቻ ይሁን", false);

        const phoneExists = await isPhoneRegistered(phone);
        if(phoneExists) return showMessage("ይህ ስልክ ቀድሞ ተመዝግቧል! በመግቢያ ገጽ ይሞክሩ", false);
        
        const nameExists = await isFullNameRegistered(fullName);
        if(nameExists) return showMessage("ይህ ስም ቀድሞ ተመዝግቧል! ሌላ ስም ይጠቀሙ", false);

        tempRegData = { phone, fullName, fatherName, password, photoData: null };
        
        showMessage("መረጃዎ በማስቀመጥ ላይ (እባክዎ ይጠብቁ)...", true);
        
        const docId = await saveInitialUserData(tempRegData);
        
        if(docId) {
            pendingDocId = docId;
            showMessage(`🎉 እንኳን ደስ ያለዎት ${fullName}! አሁን ፎቶ ይምረጡ`, true);
            document.getElementById('step1').classList.remove('active');
            document.getElementById('step2').classList.add('active');
            currentPhotoData = null;
            document.getElementById('photoPreviewArea').innerHTML = '📸 ካሜራ ወይም ጋላሪ ይጫኑ';
        } else {
            showMessage("ይቅርታ፣ መረጃዎን ማስቀመጥ አልተቻለም። ዳግም ሞክሩ", false);
        }
    };

    function handleSelectedFile(file) {
        if(!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
            currentPhotoData = e.target.result;
            const previewDiv = document.getElementById('photoPreviewArea');
            previewDiv.innerHTML = `<img src="${currentPhotoData}" alt="preview">`;
            showMessage("ፎቶ ተመርጧል! አሁን 'ፎቶ ተቀበል' ይጫኑ", true);
        };
        reader.readAsDataURL(file);
    }

    document.getElementById('cameraFrontBtn').onclick = () => {
        let input = document.createElement('input');
        input.type = 'file';
        input.accept = 'image/*';
        input.capture = 'user';
        input.onchange = (e) => handleSelectedFile(e.target.files[0]);
        input.click();
    };
    document.getElementById('galleryBtn').onclick = () => {
        let input = document.createElement('input');
        input.type = 'file';
        input.accept = 'image/*';
        input.onchange = (e) => handleSelectedFile(e.target.files[0]);
        input.click();
    };

    // ፎቶ ተቀበል (ምዝገባ ሲጠናቀቅ ቀጥታ ወደ ዳሽቦርድ ይሄዳል)
    document.getElementById('acceptPhotoBtn').onclick = async () => {
        if(!currentPhotoData) {
            showMessage("እባክዎ መጀመሪያ ፎቶ ያንሱ ወይም ከጋላሪ ይምረጡ", false);
            return;
        }
        if(!pendingDocId) {
            showMessage("የምዝገባ ሂደት አልተጀመረም። እባክዎ ዳግም ይሞክሩ", false);
            return;
        }
        showMessage("ፎቶ በማስቀመጥ ላይ (እባክዎ ይጠብቁ)...", true);
        
        const success = await updateUserWithPhoto(pendingDocId, currentPhotoData);
        if(success) {
            showMessage("✅ ምዝገባ ተጠናቋል! ወደ ዳሽቦርድ እየተሸጋገሩ ነው...", true);
            setTimeout(() => {
                showDashboard(); // ወደ ዳሽቦርድ ይሄዳል
            }, 1500);
        } else {
            showMessage("ይቅርታ፣ ፎቶውን ማስቀመጥ አልተቻለም። ዳግም ሞክሩ", false);
        }
    };

    // የመግቢያ ተግባር
    document.getElementById('doLoginBtn').onclick = async () => {
        const phone = document.getElementById('loginPhone').value.trim();
        const pwd = document.getElementById('loginPassword').value;
        const result = await findUserForLogin(phone, pwd);
        
        if(!result.exists) {
            showMessage("ስልክ ወይም ፓስወርድ ተሳስቷል። እባክዎ ዳግም ይሞክሩ", false);
            return;
        }
        if(result.blocked) {
            showMessage("መለያዎ በአስተዳዳሪ ታግዷል። እባክዎ ያግኙን", false);
            return;
        }
        if(result.photoStatus !== 'accepted') {
            showMessage("ምዝገባዎ አልተጠናቀቀም። እባክዎ ፎቶ ይምረጡ", false);
            return;
        }
        showMessage(`✅ እንኳን ደህና መጡ ${result.fullName}!`, true);
        setTimeout(() => {
            showDashboard(); // ወደ ዳሽቦርድ ይሄዳል
        }, 1000);
    };

    async function checkGlobalBlock() {
        const blocked = await isAppBlocked();
        if(blocked) {
            document.body.innerHTML = `
                <div style="position:fixed;top:0;left:0;width:100%;height:100%;background:#1a0000;display:flex;justify-content:center;align-items:center;z-index:2000;">
                    <div style="background:#8b0000;padding:40px;border-radius:30px;text-align:center;color:white;">
                        <h1>⛔ አገልግሎቱ ለጊዜው ተቋርጧል</h1>
                        <p>እባክዎ ቆይተው ይሞክሩ ወይም አስተዳዳሪውን ያግኙ።</p>
                    </div>
                </div>
            `;
        }
    }
    checkGlobalBlock();

    setMode('register');
</script>
</body>
</html>
